name: Publish GitHub contribution feed

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate GitHub contribution feed
        env:
          GITHUB_USERNAME: simoouahbiGHALINOA
          CONTRIBUTION_SITE: simoouahbighalinoa
          GITHUB_TOKEN: ${{ secrets.GITHUB_PAT || github.token }}
          GITHUB_CONTRIBUTION_OUTPUT_PATH: public/github-contributions.json
        run: node scripts/update-github-contribution-feed.mjs
      - name: Build site
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_MUSIC_SYNC_URL: ${{ vars.VITE_MUSIC_SYNC_URL }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
