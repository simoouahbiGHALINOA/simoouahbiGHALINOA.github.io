<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECO HTML Starter</title>
  </head>
  <body>
    <header>
      <a href="#main">Skip to content</a>
      <nav aria-label="Starter navigation">
        <a href="#main">Home</a>
        <a href="#about">About this list</a>
      </nav>
    </header>
    <main id="main">
      <h1>Build with semantic HTML.</h1>
      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Starter tasks</h2>
        <ul>
          <li><label><input type="checkbox" checked /> Create a starter project</label></li>
          <li><label><input type="checkbox" /> Build a new feature</label></li>
        </ul>
      </section>
      <section id="about" aria-labelledby="about-heading">
        <h2 id="about-heading">A clean, accessible starting point</h2>
        <p>Use semantic headings, navigation, and form controls to make tasks easier to understand and use.</p>
      </section>
    </main>
  </body>
</html>
