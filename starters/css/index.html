<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECO CSS Starter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">ECO TASKS</p>
      <h1>A little progress, every day.</h1>
      <p class="summary">One of two tasks complete</p>
      <ul class="task-list" aria-label="Starter tasks">
        <li class="task-row">
          <label><input type="checkbox" checked /> Create a starter project</label>
          <span class="task-status">Done</span>
        </li>
        <li class="task-row">
          <label><input type="checkbox" /> Build a new feature</label>
          <span class="task-status">Next</span>
        </li>
      </ul>
      <a href="../README.md">Explore all language starters</a>
    </main>
  </body>
</html>
