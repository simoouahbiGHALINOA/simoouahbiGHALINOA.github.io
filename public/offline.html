<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050608" />
    <title>You're offline | @eco</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #050608; color: #f5f6fb; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 1.5rem; place-items: center; }
      main { width: min(100%, 34rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #293044; border-radius: 1.25rem; background: #10131b; }
      p { color: #a9aec0; line-height: 1.7; }
      a { color: #a4b2ff; }
    </style>
  </head>
  <body>
    <main>
      <p>OFFLINE MODE</p>
      <h1>You're offline</h1>
      <p>This page hasn't been saved on this device yet. Reconnect to the internet, then revisit the site to make its pages available offline.</p>
      <a href="/">Try the home page</a>
    </main>
  </body>
</html>
